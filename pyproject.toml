[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "fuzzy-dedupe"
version = "0.1.0"
description = "Find near-duplicate names in a list. Same API in pure Python and in Rust (PyO3)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "fuzzy_dedupe._native"
features = ["pyo3/extension-module"]
