# SonarCloud Automatic Analysis reads this file (not sonar-project.properties).

sonar.sources=src,python
sonar.tests=tests
sonar.python.version=3.9

# Two findings are by design, so they are ignored for these files only, not
# by excluding whole folders: everything else in them is still analysed.
sonar.issue.ignore.multicriteria=bench_rng,ci_local_wheel

# The benchmark generates its names with a seeded random.Random so every run
# measures the same data. Nothing secret depends on it.
sonar.issue.ignore.multicriteria.bench_rng.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.bench_rng.resourceKey=bench/**

# A command line tool that reads the CSV the user names and writes where the
# user asks. Opening a user-supplied path is its whole job. The taint rule
# (pythonsecurity:S8707) can't be ignored per file, so this one thin wrapper is
# left out of analysis; the algorithms it calls are in src/ and reference.py.
sonar.exclusions=python/fuzzy_dedupe/cli.py

# CI installs the wheel it has just built from dist/, by file path. Third-party
# tools are installed from ci/requirements-*.txt with --require-hashes.
sonar.issue.ignore.multicriteria.ci_local_wheel.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.ci_local_wheel.resourceKey=.github/workflows/ci.yml
