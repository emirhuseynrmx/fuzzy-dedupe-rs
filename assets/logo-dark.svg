<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-label="fuzzy-dedupe">
  <rect width="720" height="180" rx="20" fill="#0d1117"/>
  <!-- two slightly different copies of the same name -->
  <g transform="translate(40 40)">
    <rect x="0" y="14" width="96" height="60" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="2" transform="rotate(-7 48 44)"/>
    <rect x="10" y="30" width="96" height="60" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="2" transform="rotate(5 58 60)"/>
    <rect x="26" y="50" width="52" height="7" rx="3.5" fill="#484f58" transform="rotate(5 58 60)"/>
    <rect x="26" y="64" width="34" height="7" rx="3.5" fill="#484f58" transform="rotate(5 58 60)"/>
  </g>
  <!-- merge arrow -->
  <path d="M168 90 h34 m-12 -12 l12 12 l-12 12" fill="none" stroke="#8b949e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- one clean record -->
  <g transform="translate(222 60)">
    <rect x="0" y="0" width="96" height="60" rx="10" fill="#f76707"/>
    <rect x="16" y="20" width="52" height="7" rx="3.5" fill="#0d1117"/>
    <rect x="16" y="34" width="34" height="7" rx="3.5" fill="#0d1117" opacity="0.75"/>
  </g>
  <text x="352" y="92" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#e6edf3" letter-spacing="-1">fuzzy-dedupe</text>
  <text x="354" y="126" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#8b949e">near-duplicate names, Python to Rust</text>
</svg>
