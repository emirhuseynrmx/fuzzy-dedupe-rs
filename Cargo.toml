[package]
name = "fuzzy-dedupe"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
rayon = "1.10"

[profile.release]
lto = true
codegen-units = 1
