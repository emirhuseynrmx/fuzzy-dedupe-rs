name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features python -- -D warnings
      - name: Tests, including property tests (bit-parallel == DP, index == brute force)
        run: cargo test --release
        env:
          PROPTEST_CASES: "2000"

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install locked test tools (hashes checked, wheels only)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r ci/requirements-test.txt
      - name: Build and install the wheel
        shell: bash
        run: |
          maturin build --release --out dist
          python -m pip install --no-index --no-deps --only-binary :all: dist/fuzzy_dedupe-*.whl
      - name: Rust and Python give the same answers
        run: python -m pytest -q
      - name: Benchmark (small, just to show it runs)
        run: python bench/bench.py 800
      - name: Example with ProofFrame
        if: matrix.python == '3.13'
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pip install --require-hashes --only-binary :all: -r ci/requirements-examples.txt
          python examples/clean_customers.py examples/customers.csv
      - name: Same pairs as RapidFuzz on DBLP-ACM (labelled real data)
        if: matrix.python == '3.13' && matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --require-hashes --only-binary :all: -r ci/requirements-compare.txt
          python bench/rapidfuzz_compare.py --dblp-acm | tee compare.md
          ! grep -q "| NO" compare.md

  coverage:
    name: coverage (Rust + Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload, no token secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Rust coverage
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --release --lcov --output-path rust.lcov
      - name: Python coverage
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --require-hashes --only-binary :all: -r ci/requirements-test.txt
          maturin develop --release
          pytest -q --cov=fuzzy_dedupe --cov-report=xml:python.xml
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: rust.lcov,python.xml
          use_oidc: true
          fail_ci_if_error: false

  wheels:
    name: wheel (${{ matrix.os }})
    needs: [rust, test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist
